spring.application.name=taskmanager

# Set MONGODB_URI in your environment for Atlas or another remote database.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/taskmanager}

# Set JWT_SECRET in your environment. Use a long random Base64 value in production.
app.jwt.secret=${JWT_SECRET:replace-with-a-long-random-base64-secret}
app.jwt.expiration-ms=86400000

# Set OPENAI_API_KEY in your environment. Empty means AI enrichment uses fallback values.
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.base-url=https://api.openai.com
app.openai.model=gpt-4o-mini
app.openai.timeout-seconds=30
